# ==============================================================================
# HustWebAuth 配置文件示例 (example.yaml)
#
# 本文件提供了 HustWebAuth 校园网认证程序的完整配置项定义与详尽中文注释。
# 适用于华中科技大学 (HUST) 及其他采用锐捷 (Ruijie) Web 认证系统的网络环境。
#
# 【使用方法】
# 1. 默认路径：将本文件复制并重命名为 $HOME/HustWebAuth.yaml
#    cp example.yaml ~/HustWebAuth.yaml
# 2. 指定路径：运行时通过 -f 或 --config 参数指定配置文件路径
#    HustWebAuth -f /etc/HustWebAuth.yaml
# 3. 系统服务：安装为 systemd / OpenWrt 系统服务时指定配置文件
#    HustWebAuth service install -f /etc/HustWebAuth.yaml
#
# 【配置优先级】
# 命令行参数 (CLI Flags) > 环境变量 (ENV) > YAML 配置文件 > 默认内置值 (Defaults)
#
# 【支持的两大经典架构场景】
# 场景一：单网卡基础架构（单账号或单网卡多账号轮转主备池）
#   - 在 net.iface 中指定物理网卡名称（如 eth0）或留空使用系统默认路由网卡。
#   - 在 auth 模块中配置单账号 (auth.account) 或多账号池 (auth.accounts)。
#   - 将下方的 interfaces 列表注释掉或留空。
#
# 场景二：单线多拨多网卡独立主备账号池并发架构（多 WAN / OpenWrt MWAN3 虚拟拨号）
#   - 保持 net.iface: "" 为空。
#   - 在 interfaces 列表中为每个虚拟网卡（如 vwan1, vwan2）独立配置专属账号池、
#     专属探测端点及冷却退避参数。
#   - 程序启动后将自动为每个网口启动独立并发的后台 Worker 协程，互不干扰。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 认证模块配置 (auth)
# ------------------------------------------------------------------------------
auth:
  # [必填/备用] 认证账号
  # 当未配置 accounts 列表时生效；亦支持英文逗号分隔的多账号形式，如: "user1,user2"
  # 注意：若下方配置了 accounts 列表，则 accounts 优先级高于此处的 account
  account: "U202300001"

  # [必填/备用] 认证密码
  # 与 account 对应；多账号时亦可用英文逗号分隔，如: "pass1,pass2"（单个密码会自动复用到所有账号）
  password: "YourPasswordHere"

  # [可选] 锐捷服务类型，默认值: "internet"
  # 可选值:
  #   - "internet": 校园网公网出口（可访问校外互联网）
  #   - "local":    校园网内部局域网出口（仅访问校内/教育网资源，不计外网计费或限额）
  serviceType: "internet"

  # [可选] 密码是否已被前端加密，默认值: false
  # 可选值:
  #   - false: 提交明文密码，程序内部会在认证请求时自动执行锐捷加密算法
  #   - true:  提交已由算法生成的密文密码，程序将直接发送而不做二次加密
  encrypt: false

  # [可选] 初始基准冷却时长，默认值: "4m59s"
  # 当账号认证失败、欠费或掉线触发退避时，该账号将进入冷却期，避免因短时间内频繁认证
  # 触发校园网网关的防暴力破解锁定（校园网典型锁定时长为 5 分钟）
  cooldown: "4m59s"

  # [可选] 最大指数退避冷却时长上限，默认值: "2h0m0s"
  # 当某账号发生连续认证失败时，冷却时间将按指数递增（baseCooldown * 2^fails），
  # 但最终冷却时长不会超过此上限，防止等待时间无限膨胀
  maxCooldown: "2h0m0s"

  # [可选] 多账号轮转模式开关，默认值: true
  # 可选值:
  #   - true:  轮转模式（负载均衡）。认证成功或遇到故障时自动切至下一个账号，均衡多账号流量
  #   - false: 主备模式（故障切换）。优先固定使用主账号，仅在主账号冷却时才使用备用账号
  rotation: true

  # [可选] 全局多账号轮转/主备列表
  # 当配置了本列表时，其优先级高于单个 account/password 配置
  # 在【场景一】中，单网卡将使用此列表进行多账号轮转保活；
  # 在【场景二】中，若下方 interfaces 里的某网口未定义专属 accounts，亦将继承此全局列表
  accounts:
    - account: "U202300001"
      password: "Password1"
      serviceType: "internet"
      encrypt: false
    - account: "U202300002"
      password: "Password2"
      serviceType: "internet"
      encrypt: false

# ------------------------------------------------------------------------------
# 2. 网络与接口绑定配置 (net)
# ------------------------------------------------------------------------------
net:
  # [可选] 绑定的物理网卡、虚拟网口名称或源 IP 地址，默认值: ""
  # 示例值: "eth0", "vwan1", "macvlan0", "192.168.1.100"
  #
  # 架构切换关键说明：
  # 【场景一：单网卡模式】填入具体网卡名（如 "eth0"），程序仅对该网卡执行认证保活
  # 【场景二：单线多拨多网卡模式】保持留空 ""，并在下方 interfaces 列表中指定多个网口，
  #                       程序将为每个网口启动独立并发的 Worker 协程
  iface: ""

  # [可选] 是否允许跳过 TLS 证书合法性校验，默认值: true
  # 可选值:
  #   - true:  忽略证书过期、自签名或域名不匹配错误（推荐，国内大部分校园网 Portal 证书老旧未更新）
  #   - false: 严格验证 TLS 证书链
  insecure: true

# ------------------------------------------------------------------------------
# 3. 单线多拨多网卡独立主备账号池并发配置 (interfaces) - 【场景二核心配置】
# ------------------------------------------------------------------------------
# 当 net.iface 为空且配置了 interfaces 列表时，程序将为列表中的每个网口分别启动独立的并发 Worker 协程。
# 每个 Worker 拥有完全独立的账号池状态机、连通性探测循环与退避冷却定时器，互不干扰。
# 若不需要多网卡并发（即【场景一】），可清空或注释本段。
interfaces:
  # 接口一：虚拟拨号网口 1 (例如 OpenWrt 单线多拨 vwan1)
  - iface: "vwan1"
    # [可选] 该网口专用的连通性探测端点，未设置时继承全局 check.url
    checkURL: "http://connect.rom.miui.com/generate_204"
    # [可选] 该网口独立的初始冷却退避时长，未设置时继承全局 auth.cooldown
    cooldown: "4m59s"
    # [可选] 该网口独立的最大冷却时长上限，未设置时继承全局 auth.maxCooldown
    maxCooldown: "2h0m0s"
    # [可选] 该网口专用的独立账号池；若留空则自动继承全局 auth.accounts
    accounts:
      - account: "vwan1_user1"
        password: "vwan1_pass1"
        serviceType: "internet"
        encrypt: false
      - account: "vwan1_user2"
        password: "vwan1_pass2"
        serviceType: "internet"
        encrypt: false

  # 接口二：虚拟拨号网口 2 (例如 OpenWrt 单线多拨 vwan2)
  - iface: "vwan2"
    checkURL: "http://connect.rom.miui.com/generate_204"
    cooldown: "4m59s"
    maxCooldown: "2h0m0s"
    accounts:
      - account: "vwan2_user1"
        password: "vwan2_pass1"
        serviceType: "internet"
        encrypt: false

# ------------------------------------------------------------------------------
# 4. 网络连通性探测配置 (check)
# ------------------------------------------------------------------------------
check:
  # [可选] 连通性探测端点 URL，默认值: "http://connect.rom.miui.com/generate_204"
  # 程序向此地址发起带 SO_BINDTODEVICE 绑定的 HTTP GET 请求：
  #   - 若返回 HTTP 204 No Content，判定当前网口网络通畅、已认证在线；
  #   - 若返回 301/302 重定向或包含跳转脚本的 200 页面，判定被校园网 Portal 劫持，
  #     自动解析提取登录认证重定向 URL；
  # 常用备选端点（需返回 HTTP 204）：
  #   - http://connect.rom.miui.com/generate_204 (小米 MIUI 探测，国内延迟极低，推荐)
  #   - http://cp.cloudflare.com/generate_204    (Cloudflare 探测服务)
  #   - http://www.qualcomm.cn/generate_204     (高通中国探测服务)
  url: "http://connect.rom.miui.com/generate_204"

  # [可选] 连通性探测超时时长，默认值: "5s"
  # 超过此时间未返回响应则视为超时或未联通
  timeout: "5s"

# ------------------------------------------------------------------------------
# 5. 重定向与 Portal 降级回退配置 (redirect)
# ------------------------------------------------------------------------------
redirect:
  # [可选] 触发 Portal 劫持的测试地址，默认值: "http://123.123.123.123"
  # 当处于未认证断网状态时，校园网通常会拦截阻断 DNS 解析，导致基于域名的 check.url 探测失败。
  # 此时程序会自动回退向此纯 IP 地址发起 HTTP 请求，绕过 DNS 解析，直接触发网关 Portal 劫持并提取登录 URL
  url: "http://123.123.123.123"

# ------------------------------------------------------------------------------
# 6. 周期心跳与自动重连配置 (cycle)
# ------------------------------------------------------------------------------
cycle:
  # [可选] 是否启用周期性轮询保活模式，默认值: false（服务或长期运行推荐开启: true）
  # 可选值:
  #   - false: 仅在程序启动时执行单次检测与认证，完成后立即退出
  #   - true:  常驻后台，每隔 cycle.duration 时间自动检测网络连通性，掉线自动重连与轮转
  enable: true

  # [可选] 周期性检测的时间间隔，默认值: "5m0s"
  # 常用值: "1m", "3m", "5m", "10m"
  duration: "5m0s"

  # [可选] 连续认证失败的最大重试次数，默认值: 3
  # 可选值:
  #   - >0: 连续失败达指定次数后 Worker 停止运行
  #   - -1: 无限重试（适合路由器、无人值守软路由等长期无人干预的场景）
  retry: 3

# ------------------------------------------------------------------------------
# 7. 守护进程配置 (daemon)
# ------------------------------------------------------------------------------
daemon:
  # [可选] 是否作为后台守护进程运行，默认值: false (Windows 系统不支持)
  # 注意：若使用 systemd 或 OpenWrt init.d (HustWebAuth service install) 管控服务，
  # 请保持 false，由系统服务管理器直接接管前台进程
  enable: false

  # [可选] 守护进程的 PID 锁文件路径，默认值: ""
  # 默认留空时，程序将自动生成路径：/var/run/HustWebAuth[_iface]_daemon.pid
  pidFile: "/var/run/HustWebAuth_daemon.pid"

# ------------------------------------------------------------------------------
# 8. 日志系统配置 (log)
# ------------------------------------------------------------------------------
log:
  # [可选] 日志存储目录，默认值: 系统临时目录下的 "HustWebAuth"（如 /tmp/HustWebAuth）
  dir: "/tmp/HustWebAuth"

  # [可选] 日志输出文件名，默认值: ""
  # 留空 "" 时日志将直接输出到标准输出 (os.stdout)，方便终端查看或 systemd journal 收集；
  # 填入文件名（如 "HustWebAuth.log"）时将写入到 log.dir/log.file 文件中
  file: "HustWebAuth.log"

  # [可选] 是否在日志文件名后添加随机后缀，默认值: false (CLI 默认 true)
  # 若 file 中包含通配符 "*"，随机字符串将替换最后一个 "*"；常驻服务建议设为 false 以便日志轮转收集
  random: false

  # [可选] 是否以追加模式写入日志文件，默认值: true
  # 可选值:
  #   - true:  新日志追加在文件末尾
  #   - false: 每次启动覆盖并清空原文件（当 random 为 true 时此项被忽略）
  append: true

  # [可选] 网络正常连通时是否记录 "The network is connected" 日志，默认值: false (CLI 默认 true)
  # 长期运行时建议设为 false，避免周期保活每隔几分钟就输出一行心跳日志导致日志文件膨胀；
  # 仅在调试或排查掉线问题时建议临时设为 true
  connected: false

  # [可选] 是否将日志同时输出至系统 syslog，默认值: false (Windows 系统不支持)
  syslog: false

# ------------------------------------------------------------------------------
# 9. 旧版 ICMP Ping 连通性探测配置 (ping) - 【可选兼容字段】
# ------------------------------------------------------------------------------
# 说明：本项目现已全面采用更精准且支持网口强绑定的 HTTP 204 探测方案 (check 模块)。
# 下列 ping 字段仅保留用于旧版本配置文件的向后兼容，通常无需修改：
ping:
  # [可选/已废弃] ICMP Ping 目标 IP 地址，默认值: "202.114.0.131" (华中科技大学校园 DNS)
  ip: "202.114.0.131"

  # [可选/已废弃] 每次 Ping 探测的发包数量，默认值: 3
  count: 3

  # [可选/已废弃] 单次 Ping 探测的超时时长，默认值: "3s"
  timeout: "3s"

  # [可选/已废弃] 是否使用特权原始 ICMP 套接字 (Raw ICMP Socket)，默认值: true
  #   - true:  发送原生 Raw ICMP 报文，需要 root / 管理员特权
  #   - false: 发送非特权 UDP Ping 报文
  privilege: true
